<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY PORTFOLIO</title>

<style>
/* =========================================================
   ★ デザイン設定
   色を変えたいときは、まずここだけ触ればOKです。
   ========================================================= */
:root {
  --main-color: #2f6bff;   /* ★ メインカラー */
  --black: #111111;
  --paper: #f7f7f5;
  --white: #ffffff;
  --gray: #777777;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--paper);
  color:var(--black);
}
a{color:inherit;text-decoration:none}
button{font:inherit}
img{max-width:100%;display:block}

.topbar{
  position:sticky;top:0;z-index:20;height:82px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:rgba(247,247,245,.96);
}
.brand{font-size:.82rem;font-weight:900;letter-spacing:.15em}
.menu-btn{border:0;background:transparent;display:grid;justify-items:center;gap:4px;cursor:pointer}
.hamb{width:38px;display:grid;gap:5px}
.hamb span{height:6px;background:var(--main-color);border-radius:999px}
.menu-label{font-weight:900;font-size:.92rem}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.68);
  opacity:0;pointer-events:none;transition:.25s;z-index:40;
}
.overlay.open{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;top:0;right:0;width:min(82vw,520px);height:100dvh;
  background:var(--main-color);transform:translateX(105%);
  transition:.35s;z-index:50;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.close{
  align-self:flex-end;width:92px;height:92px;border:0;background:#fff;
  border-radius:0 0 0 24px;font-size:2.6rem;font-weight:900;cursor:pointer;
}
.drawer nav{margin:auto 0;display:grid;gap:34px;justify-items:center}
.navitem{text-align:center;font-size:1rem;font-weight:900;letter-spacing:.22em}
.barcode{
  width:132px;height:31px;margin:0 auto 4px;
  background:repeating-linear-gradient(
    90deg,#111 0 4px,transparent 4px 7px,#111 7px 12px,
    transparent 12px 16px,#111 16px 20px,transparent 20px 23px
  );
}
.socials{display:flex;gap:12px;justify-content:center;padding-bottom:40px}
.social{
  width:58px;height:58px;background:#111;color:#fff;border-radius:14px;
  display:grid;place-items:center;font-weight:900;font-size:1.25rem;
}

.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.section{padding:30px 0 80px}
.section-head{display:flex;align-items:center;margin:10px 0 52px}
.dot{width:82px;height:82px;border-radius:50%;background:var(--main-color);flex:0 0 auto}
.title{
  margin:0 0 0 -35px;font-size:clamp(2.3rem,10vw,5.6rem);
  letter-spacing:-.06em;line-height:.9;
}

.hero{
  min-height:calc(100dvh - 82px);
  display:grid;gap:24px;align-items:center;padding:12px 0 60px;
}
.hero-art{
  min-height:420px;background:var(--main-color);position:relative;overflow:hidden;
}
.hero-art:before{content:"";position:absolute;inset:24px;border:3px solid #111}
.hero-art svg{position:absolute;width:90%;height:90%;left:5%;bottom:0}
.hero-art img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.kicker{font-size:.8rem;font-weight:900;letter-spacing:.25em}
.hero h1{
  margin:8px 0 0;font-size:clamp(3.8rem,16vw,8rem);
  line-height:.8;letter-spacing:-.07em;
}
.hero h1 span{
  display:block;color:var(--main-color);
  text-shadow:2px 2px 0 #111;
}
.hero p{line-height:1.9;color:#333;max-width:600px}

.char-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:26px 20px;width:min(720px,100%);margin:auto;
}
.char{display:grid;justify-items:center;text-align:center;cursor:pointer}
.avatar{
  width:min(100%,220px);aspect-ratio:1;border-radius:50%;
  background:white;border:7px solid white;outline:3px solid #111;
  filter:drop-shadow(0 6px 5px rgba(0,0,0,.18));
  overflow:hidden;display:grid;place-items:center;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:100%;height:100%}
.char b{margin-top:11px;letter-spacing:.14em}
.char small{color:#777}

.detail{display:grid;gap:28px}
.fullbody{
  min-height:610px;background:#fff;border:1px solid #e5e5e5;
  display:grid;place-items:end center;overflow:hidden;
}
.fullbody img{width:100%;height:100%;object-fit:contain}
.fullbody svg{width:88%;max-width:560px}
.profile h2{
  font-size:clamp(3.2rem,14vw,6rem);
  margin:0;line-height:.85;letter-spacing:-.06em;
}
.jp{font-weight:900;letter-spacing:.14em;color:#666;margin:8px 0 25px}
.specs{border-top:2px solid #111;display:grid;grid-template-columns:1fr 1fr}
.spec{padding:13px 0;border-bottom:1px solid #ccc}
.spec b{display:block;font-size:.7rem;letter-spacing:.15em}
.profile-text{line-height:1.9}
.back{display:inline-flex;gap:8px;align-items:center;font-weight:900;letter-spacing:.08em;margin-bottom:24px}
.back::before{content:"←";color:var(--main-color);font-size:1.4rem}

.works{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.work{background:#fff;border:1px solid #ddd}
.work-visual{aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden}
.work-visual img{width:100%;height:100%;object-fit:cover}
.work:nth-child(3n+1) .work-visual{background:var(--main-color)}
.work:nth-child(3n+2) .work-visual{background:white}
.work:nth-child(3n) .work-visual{background:#111}
.shape{width:58%;aspect-ratio:1;border-radius:50%;background:#111}
.work:nth-child(3n) .shape{background:var(--main-color)}
.meta{padding:12px}
.meta b{display:block}
.meta small{color:#777}

.contact{background:#111;color:white;padding:28px}
.contact-big{
  font-weight:900;font-size:clamp(3rem,13vw,6.5rem);
  line-height:.8;letter-spacing:-.05em;margin-bottom:30px;
}
.contact-links{display:grid;gap:10px}
.contact-link{border:1px solid #555;padding:16px 18px;display:flex;justify-content:space-between}
footer{text-align:center;color:#777;padding:25px 16px 45px;font-size:.75rem}


/* ===== MUSIC PLAYER ===== */
.music-player{position:fixed;left:14px;bottom:14px;z-index:30;width:min(330px,calc(100vw - 28px));background:#111;color:#fff;border:2px solid #111;box-shadow:5px 5px 0 var(--main-color)}
.music-head{display:flex;justify-content:space-between;padding:9px 12px;background:var(--main-color);color:#111;font-size:.68rem;font-weight:900;letter-spacing:.18em}
.music-body{display:flex;align-items:center;gap:11px;padding:11px 12px}
.music-play{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#111;font-weight:900;cursor:pointer}
.music-info{min-width:0;flex:1}.music-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-artist{font-size:.7rem;color:#aaa;margin-top:3px}.music-note{font-size:1.25rem;color:var(--main-color)}
.music-youtube{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:-9999px}
@media(min-width:820px){
  .hero{grid-template-columns:1fr 1fr}
  .hero-art{order:2;min-height:650px}
  .char-grid{grid-template-columns:repeat(4,1fr)}
  .detail{grid-template-columns:1.1fr .9fr;align-items:end}
  .works{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="#home" id="brandText"></a>
  <button class="menu-btn" id="menuBtn" aria-label="メニューを開く">
    <span class="hamb"><span></span><span></span><span></span></span>
    <span class="menu-label">menu</span>
  </button>
</header>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">
  <button class="close" id="closeBtn">×</button>
  <nav>
    <a class="navitem" href="#home"><div class="barcode"></div>HOME</a>
    <a class="navitem" href="#characters"><div class="barcode"></div>CHARACTERS</a>
    <a class="navitem" href="#works"><div class="barcode"></div>WORKS</a>
    <a class="navitem" href="#contact"><div class="barcode"></div>CONTACT</a>
  </nav>
  <div class="socials" id="socialButtons"></div>
</aside>

<main>
  <section class="view" data-page="home">
    <div class="hero wrap">
      <div>
        <div class="kicker" id="heroKicker"></div>
        <h1 id="heroTitle"></h1>
        <p id="heroText"></p>
      </div>
      <div class="hero-art" id="heroArt"></div>
    </div>
  </section>

  <section class="view" data-page="characters">
    <div class="section wrap">
      <div class="section-head">
        <div class="dot"></div>
        <h1 class="title">CHARACTERS</h1>
      </div>
      <div class="char-grid" id="characterGrid"></div>
    </div>
  </section>

  <section class="view" data-page="character">
    <div class="section wrap">
      <a class="back" href="#characters">CHARACTERS</a>
      <div class="section-head">
        <div class="dot"></div>
        <h1 class="title">CHARACTER</h1>
      </div>
      <div class="detail">
        <div class="fullbody" id="characterImage"></div>
        <div class="profile">
          <h2 id="characterName"></h2>
          <div class="jp" id="characterSub"></div>
          <div class="specs" id="characterSpecs"></div>
          <p class="profile-text" id="characterText"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="view" data-page="works">
    <div class="section wrap">
      <div class="section-head">
        <div class="dot"></div>
        <h1 class="title">WORKS</h1>
      </div>
      <div class="works" id="worksGrid"></div>
    </div>
  </section>

  <section class="view" data-page="contact">
    <div class="section wrap">
      <div class="section-head">
        <div class="dot"></div>
        <h1 class="title">CONTACT</h1>
      </div>
      <div class="contact">
        <div class="contact-big">GET<br>IN<br>TOUCH.</div>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </div>
  </section>
</main>

<footer id="footerText"></footer>
<div class="music-player">
 <div class="music-head"><span>NOW PLAYING</span><span>YOUTUBE</span></div>
 <div class="music-body"><button class="music-play" id="musicPlay">▶</button><div class="music-info"><div class="music-title" id="musicTitle"></div><div class="music-artist" id="musicArtist"></div></div><div class="music-note">♫</div></div>
 <iframe class="music-youtube" id="musicYoutube" title="YouTube music player" allow="autoplay; encrypted-media"></iframe>
</div>

<script>
/* =========================================================
   ★★★★★ ここから下だけ編集すればOK！ ★★★★★

   画像を使う場合：
   1. このHTMLと画像を同じフォルダに入れる
   2. image: "nao.png" のようにファイル名を書く

   画像をまだ入れない場合：
   image: "" のままでOK。仮画像が出ます。

   ========================================================= */

const SITE = {

  /* ===== サイト全体 ===== */
  siteName: "YOUR / PORTFOLIO",
  footer: "© 2026 YOUR NAME / PORTFOLIO. All rights reserved.",

  /* ===== HOME ===== */
  home: {
    kicker: "ORIGINAL CHARACTER / ILLUSTRATION",

    // 1行目と2行目を分けて表示します
    titleTop: "MY",
    titleBottom: "PORTFOLIO",

    text: "オリジナルキャラクター、立ち絵、イラストをまとめる個人ポートフォリオ。キャラクターや作品は右上のメニューから移動できます。",

    // 例： "main.png"
    image: ""
  },

  /* ===== MUSIC =====
     youtubeId = YouTube動画ID
     title = 表示する曲名
     artist = 表示するアーティスト名
  */
  music: {
    youtubeId: "pdfSRyRZdZ0",
    title: "MUSIC",
    artist: "YouTube"
  },

  /* ===== SNS ===== */
  socials: [
    { label: "X", url: "#" },
    { label: "P", url: "#" },
    { label: "✉", url: "mailto:you@example.com" }
  ],

  /* ===== CONTACT ===== */
  contact: [
    { label: "X / Twitter", url: "#" },
    { label: "pixiv", url: "#" },
    { label: "you@example.com", url: "mailto:you@example.com" }
  ],

  /* =====================================================
     ★ キャラクター一覧
     name      = キャラ名
     listSub   = 一覧画面でキャラ名の下に表示する文字
     sub       = 個別ページでキャラ名の下に表示するサブ表記
     age       = 年齢
     height    = 身長
     role      = 役割など
     color     = イメージカラー
     icon      = 一覧用アイコン画像
     image     = 個別ページ用立ち絵
     text      = 紹介文
     ===================================================== */
  characters: [

    {
      name: "宮蒼一郎",
      listSub: "SOICHIRO MIYAAO",
      sub: "みや　そういちろう / ORIGINAL CHARACTER",
      age: "20",
      height: "185 cm",
      role: "Artist",
      color: "Blue / Black",
      icon: "",
      image: "",
      text: "ここにキャラクターのプロフィール、設定、世界観などを書きます。"
    },

    {
      name: "REI",
      listSub: "",
      sub: "レイ / ORIGINAL CHARACTER",
      age: "24",
      height: "187 cm",
      role: "Creator",
      color: "Blue",
      icon: "",
      image: "",
      text: "ここにREIのプロフィールを書きます。"
    },

    {
      name: "NOA",
      listSub: "",
      sub: "ノア / ORIGINAL CHARACTER",
      age: "18",
      height: "180 cm",
      role: "Character",
      color: "Light Blue",
      icon: "",
      image: "",
      text: "ここにNOAのプロフィールを書きます。"
    },

    {
      name: "JIN",
      listSub: "",
      sub: "ジン / ORIGINAL CHARACTER",
      age: "26",
      height: "185 cm",
      role: "Character",
      color: "Deep Blue",
      icon: "",
      image: "",
      text: "ここにJINのプロフィールを書きます。"
    }

    /* ★ キャラを増やしたい場合は、
       上の { ... } をコピーして下に追加してください。
       1つ前の } の後ろに , を入れるのを忘れずに！
    */
  ],

  /* =====================================================
     ★ WORKS
     title = 作品名
     year  = 年など
     image = 作品画像
     ===================================================== */
  works: [
    { title: "WORK 01", year: "Illustration / 2026", image: "" },
    { title: "WORK 02", year: "Illustration / 2026", image: "" },
    { title: "WORK 03", year: "Illustration / 2026", image: "" },
    { title: "WORK 04", year: "Illustration / 2026", image: "" }
  ]
};

/* ★★★★★ 編集する場所はここまで！ ★★★★★ */


/* =========================================================
   ↓ ここから下はサイトを動かすプログラムです。
   基本的に編集しなくてOKです。
   ========================================================= */

const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");

function openMenu(){
  drawer.classList.add("open");
  overlay.classList.add("open");
  document.body.style.overflow="hidden";
}
function closeMenu(){
  drawer.classList.remove("open");
  overlay.classList.remove("open");
  document.body.style.overflow="";
}

menuBtn.addEventListener("click",openMenu);
closeBtn.addEventListener("click",closeMenu);
overlay.addEventListener("click",closeMenu);

function placeholderSvg(accent="var(--main-color)") {
  return `
  <svg viewBox="0 0 700 1000" aria-hidden="true">
    <circle cx="350" cy="180" r="90" fill="#fff" stroke="#111" stroke-width="11"/>
    <path d="M275 280 L425 280 L500 630 L200 630 Z" fill="#111"/>
    <rect x="235" y="615" width="95" height="300" rx="45" fill="#fff" stroke="#111" stroke-width="10"/>
    <rect x="370" y="615" width="95" height="300" rx="45" fill="#fff" stroke="#111" stroke-width="10"/>
    <path d="M275 305 L165 525" stroke="#111" stroke-width="38" stroke-linecap="round"/>
    <path d="M425 305 L545 525" stroke="#111" stroke-width="38" stroke-linecap="round"/>
  </svg>`;
}

function avatarPlaceholder(index) {
  const colors = ["#2f6bff","#6aa6ff","#8fc5ff","#1647a8","#b7d4ff","#7f9fd9","#355a9c","#dbe8ff"];
  const color = colors[index % colors.length];
  return `
  <svg viewBox="0 0 300 300">
    <circle cx="150" cy="150" r="150" fill="${color}"/>
    <circle cx="150" cy="125" r="78" fill="#fff"/>
    <path d="M56 270c17-74 65-115 94-115s77 41 94 115" fill="#111"/>
    <circle cx="122" cy="125" r="8"/>
    <circle cx="178" cy="125" r="8"/>
  </svg>`;
}

let musicPlaying = false;
function setupMusic(){
 const play=document.getElementById("musicPlay"), frame=document.getElementById("musicYoutube");
 document.getElementById("musicTitle").textContent=SITE.music.title;
 document.getElementById("musicArtist").textContent=SITE.music.artist;
 play.addEventListener("click",()=>{
   if(!musicPlaying){
     frame.src=`https://www.youtube.com/embed/${SITE.music.youtubeId}?autoplay=1&playsinline=1`;
     play.textContent="■"; musicPlaying=true;
   }else{
     frame.src=""; play.textContent="▶"; musicPlaying=false;
   }
 });
}

function renderSite() {
  document.title = SITE.siteName;
  document.getElementById("brandText").textContent = SITE.siteName;
  document.getElementById("footerText").textContent = SITE.footer;

  document.getElementById("heroKicker").textContent = SITE.home.kicker;
  document.getElementById("heroTitle").innerHTML =
    `${SITE.home.titleTop}<span>${SITE.home.titleBottom}</span>`;
  document.getElementById("heroText").textContent = SITE.home.text;
  document.getElementById("heroArt").innerHTML =
    SITE.home.image
      ? `<img src="${SITE.home.image}" alt="メインビジュアル">`
      : placeholderSvg();

  const socialButtons = document.getElementById("socialButtons");
  socialButtons.innerHTML = SITE.socials.map(s =>
    `<a class="social" href="${s.url}">${s.label}</a>`
  ).join("");

  const contactLinks = document.getElementById("contactLinks");
  contactLinks.innerHTML = SITE.contact.map(c =>
    `<a class="contact-link" href="${c.url}">
      <span>${c.label}</span><b>↗</b>
    </a>`
  ).join("");

  const characterGrid = document.getElementById("characterGrid");
  characterGrid.innerHTML = SITE.characters.map((c,i) => `
    <a class="char" href="#character-${i}">
      <div class="avatar">
        ${c.icon ? `<img src="${c.icon}" alt="${c.name}">` : avatarPlaceholder(i)}
      </div>
      <b>${c.name}</b>
      <small>${c.listSub}</small>
    </a>
  `).join("");

  const worksGrid = document.getElementById("worksGrid");
  worksGrid.innerHTML = SITE.works.map((w,i) => `
    <article class="work">
      <div class="work-visual">
        ${w.image ? `<img src="${w.image}" alt="${w.title}">` : `<div class="shape"></div>`}
      </div>
      <div class="meta">
        <b>${w.title}</b>
        <small>${w.year}</small>
      </div>
    </article>
  `).join("");
}

function renderCharacter(index) {
  const c = SITE.characters[index] || SITE.characters[0];

  document.getElementById("characterName").textContent = c.name;
  document.getElementById("characterSub").textContent = c.sub;
  document.getElementById("characterText").textContent = c.text;

  document.getElementById("characterSpecs").innerHTML = `
    <div class="spec"><b>AGE</b>${c.age}</div>
    <div class="spec"><b>HEIGHT</b>${c.height}</div>
    <div class="spec"><b>ROLE</b>${c.role}</div>
    <div class="spec"><b>COLOR</b>${c.color}</div>
  `;

  document.getElementById("characterImage").innerHTML =
    c.image
      ? `<img src="${c.image}" alt="${c.name}">`
      : placeholderSvg();
}

function showPage() {
  const hash = location.hash || "#home";
  let page = hash.slice(1);

  if(page.startsWith("character-")) {
    const index = Number(page.replace("character-",""));
    renderCharacter(index);
    page = "character";
  }

  const valid = ["home","characters","character","works","contact"];
  const target = valid.includes(page) ? page : "home";

  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.dataset.page === target)
  );

  closeMenu();
  window.scrollTo(0,0);
}

renderSite();
setupMusic();
window.addEventListener("hashchange",showPage);
showPage();
</script>
</body>
</html>
